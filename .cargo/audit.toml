# cargo-audit settings. CI runs `cargo audit --deny warnings`, so every new advisory fails the
# build. The entries below are "unmaintained" notices (no vulnerability, no fixed version);
# review them on every dependency update and remove them when the dependency is replaced.
[advisories]
ignore = [
  # chrono is unmaintained. Used for timestamps only (no parsing of untrusted time zone data).
  # Replacement candidate: jiff. Tracked in docs/ROADMAP.md.
  "RUSTSEC-2026-0543",
  # paste (proc-macro, build time only) is unmaintained; pulled in by rustls-rustcrypto.
  "RUSTSEC-2024-0436",
]
