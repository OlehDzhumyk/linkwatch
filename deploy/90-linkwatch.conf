# linkwatch sysctl settings. Remove this file to undo them (see docs/INSTALL.md).
# Values stay active until the next reboot, or until you set them back by hand.

# Unprivileged ICMP echo. The service runs as user "linkwatch" without CAP_NET_RAW.
# It sends pings through unprivileged ping sockets. This range lets every group use them.
# `linkwatch check` tests this value.
net.ipv4.ping_group_range = 0 2147483647

# The next settings matter only when two interfaces of one host sit in the same subnet
# (for example Wi-Fi and Ethernet to one router). They apply to ALL interfaces of the host.
# arp_ignore=1 and arp_announce=2: answer ARP only on the interface that owns the address,
# and announce the right source address, so each path's replies come back on its own interface.
# On a host with one interface, or with interfaces in different subnets, these two settings
# change nothing visible.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# rp_filter=2 (loose reverse-path filter): strict mode (1) drops replies on the second interface.
# Loose mode still drops packets whose source address has no route at all.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
