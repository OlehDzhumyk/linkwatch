# Needed when two interfaces of one host sit in the same subnet (Wi-Fi + Ethernet to one router):
# answer ARP only on the interface that owns the address, and announce the right source,
# so each path's replies come back on its own interface.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# Loose reverse-path filter: strict mode drops replies on the second interface.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
