# linkwatch configuration. All fields are optional; an empty file uses the defaults.
# Full commented reference: /usr/share/doc/linkwatch/examples/linkwatch.toml
# After a change: sudo systemctl restart linkwatch

profile = "standard"          # light | standard | detailed
data_dir = "/var/lib/linkwatch"

# Without [[interfaces]] all physical interfaces are monitored.
# [[interfaces]]
# name = "wlan0"
# role = "wifi"
# [[interfaces]]
# name = "eth0"
# role = "ethernet"

[web]
# Local only. To open the UI from other devices use "0.0.0.0:8080" AND set a token
# (16+ characters of A-Z a-z 0-9 _ -), then open http://<device>:8080/?token=<token> once.
listen = "127.0.0.1:8080"
# token = "change-me-to-a-long-random-string"

[speed]
# Time-based download test: at most 8 s and at most 50 MiB per interface per test.
# Every 6 h (4 tests per day), one interface at a time, no evening speed-up.
# Daily volume = 4 tests x 50 MiB x interfaces (for example 400 MiB with 2 interfaces).
# Set enabled = false to save traffic. Options: interval_min, peak_interval_min, max_bytes.
enabled = true

[intervals]
# Host health sampling interval in seconds (0 = off).
host_s = 10
# Active LAN device count interval in seconds (0 = off; e.g. 600 for every 10 min, counts only).
# lan_s = 0

[storage]
compress_old = false

[router]
# Optional read-only UPnP IGD telemetry (off by default).
enabled = false
upnp = true
interval_s = 15
